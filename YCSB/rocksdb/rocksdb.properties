rocksdb.dbname=/tmp/tmp_data/db_nvm_l0
rocksdb.nvm_path=/mnt/chen/nodememory
rocksdb.format=single
# rocksdb.destroy=false
# rocksdb.mergeupdate=false

# Load options from file
#rocksdb.optionsfile=rocksdb/options.ini

# Below options are ignored if options file is used
# rocksdb.compression=no
rocksdb.max_background_jobs=4
# rocksdb.target_file_size_base=0
# rocksdb.target_file_size_multiplier=0
# rocksdb.max_bytes_for_level_base=0
# rocksdb.write_buffer_size=0
# rocksdb.max_open_files=-1
